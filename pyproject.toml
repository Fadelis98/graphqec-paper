[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphqec"
version = "1.0.0"
description = "GraphQEC: unified and efficient quantum error correction decoding with machine learning"
authors = [
    { name = "Gengyuan Hu", email = "china.fadelis@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas",
    # machine learning
    "torch==2.5.1",
    "flash-linear-attention==0.3.0",
    # "causal-conv1d==1.5.0",
    "accelerate>=1.0.0",
    "einops",
    # visualization
    "wandb",
    "tensorboard",
    "matplotlib",
    "scipy==1.16.0",
    # QEC tools
    "stim==1.15.0",  # frozen .stim/.dem SHA-256 values are recorded with this version
    "ldpc>=2.0.0",
    "pymatching",
    # slurm submission
    "submitit",
]

[project.urls]
Homepage = "https://github.com/Fadelis98/graphqec-paper"

[tool.setuptools.packages.find]
include = ["graphqec*"]

[tool.setuptools.package-data]
"graphqec.decoder.nn.low_latency" = ["*.cu"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
